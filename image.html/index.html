<!DOCTYPE html>
<html>
<head>
  <title>Image Assignment</title>
</head>
<body>

  <h2>1. </h2>
  <img src="flower.jpg" alt="A red flower">

  <h2>2. </h2>
  <img src="images/logo.png" alt="Company logo" width="200">

  <h2>3. </h2>
  <img src="assets/images/banner.jpg" alt="Website banner">

  <h2>4. </h2>
  <img src="../photo.jpg" alt="Photo">

  <h2>5. </h2>
  <img src="images/nature.jpg" alt="Beautiful nature view" width="300" height="200">

  <h2>6. </h2>
  <img src="images/nature.jpg" alt="Nature view" title="Click to view full size">

  <h2>7. </h2>
  <img src="images/tree.jpg" alt="Tree" loading="lazy">

  <h2>8. </h2>
  <img src="images/hero.jpg" alt="Hero banner" loading="eager">

  <h2>9. </h2>
  <img src="images/car.jpg" alt="Car" loading="auto">
  <p>With loading="auto", the browser itself decides when to load the image.</p>

  <h2>10. </h2>
  <img src="images/medium800.jpg"
       srcset="images/small400.jpg 400w, images/medium800.jpg 800w, images/large1200.jpg 1200w"
       alt="Responsive nature image">

  <h2>11. </h2>
  <img src="images/shoe.jpg"
       alt="Running shoe"
       width="200"
       height="300"
       loading="lazy"
       title="Product Shoe"
       srcset="images/shoe-small400.jpg 400w, images/shoe-large1200.jpg 800w">

  <h2>12. </h2>
  <img src="assets/logo.png" alt="Company logo" width="250" loading="eager">
  <img src="images/products/shoe.jpg" alt="Shoe product photo" width="250" loading="lazy">

</body>
</html>
